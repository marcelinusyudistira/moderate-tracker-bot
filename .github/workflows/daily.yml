name: Daily Moderate Tracker

on:
  schedule:
    # Runs at 08:30 UTC (15:30 WIB / 3:30 PM Jakarta Time) every weekday
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # Allows you to click "Run" manually to test

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run Tracker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python moderate_tracker.py
